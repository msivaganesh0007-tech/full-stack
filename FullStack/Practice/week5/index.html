<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Separated DOM App</title>
  
  <!-- Link External CSS -->
  <link rel="stylesheet" href="style.css">
  
  <!-- Link External JS -->
  <script src="script.js" defer></script>
</head>
<body>

  <div class="container">
    <h2>Dynamic Task Board</h2>
    
    <div class="input-group">
      <input type="text" id="taskInput" placeholder="Enter a new item..." />
      <button id="addBtn">Add Item</button>
    </div>

    <ul id="taskList" class="list"></ul>
    <div id="emptyMessage" class="empty-state">No items added yet.</div>
  </div>

</body>
</html>
