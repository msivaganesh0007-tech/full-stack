<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Functions and Classes</title>
</head>
<body>

    <h1>JavaScript Classes and Objects</h1>

    <div id="output"></div>

    <script>

        // Function example
        function calculateArea(length, width) {
            return length * width;
        }

        const area = calculateArea(10, 5);

        // Class definition
        class Student {

            // Constructor
            constructor(name, rollNo, department) {
                this.name = name;
                this.rollNo = rollNo;
                this.department = department;
            }

            // Method
            displayDetails() {
                return `
                    Name: ${this.name}<br>
                    Roll Number: ${this.rollNo}<br>
                    Department: ${this.department}
                `;
            }
        }

        // Creating multiple objects from the same class
        const student1 = new Student(
            "Rahul",
            "101",
            "CSE"
        );

        const student2 = new Student(
            "Priya",
            "102",
            "AI & ML"
        );

        const student3 = new Student(
            "Arjun",
            "103",
            "ECE"
        );

        document.getElementById("output").innerHTML = `
            <h2>Function Example</h2>
            Area = ${area}

            <h2>Class and Objects Example</h2>

            <h3>Student 1</h3>
            ${student1.displayDetails()}

            <h3>Student 2</h3>
            ${student2.displayDetails()}

            <h3>Student 3</h3>
            ${student3.displayDetails()}
        `;

    </script>

</body>
</html>
