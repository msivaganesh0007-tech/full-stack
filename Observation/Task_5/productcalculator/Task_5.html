<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Product Calculator</title>
<link rel="stylesheet" href="Style_5.css">
</head>

<body>

<div class="container">

<header class="header">
<h1>Product Calculator</h1>
<p class="subtitle">
Full Stack Web Development - CO-1 
</p>
</header>

<main class="calculator-layout">

<section class="card form-card">

<h2>Product Details</h2>

<form id="productForm" onsubmit="return false;">

<div class="form-group">
<label for="productName">Product Name</label>
<input type="text" id="productName"
value="Mouse">
</div>

<div class="form-group">
<label for="productPrice">Price (Rs.)</label>
<input type="number" id="productPrice"
value="1499.00" min="0" step="0.01">
</div>

<div class="form-group">
<label for="productQuantity">Quantity</label>
<input type="number" id="productQuantity"
value="2" min="1">
</div>

<div class="preset-section">

<label>Quick Presets:</label>

<div class="preset-buttons">

<button type="button"
class="preset-btn"
data-name="Keyboard"
data-price="3499.00"
data-qty="1">
Keyboard
</button>

<button type="button"
class="preset-btn"
data-name="Mouse"
data-price="1499.00"
data-qty="2">
Mouse
</button>

<button type="button"
class="preset-btn"
data-name="USB-C Hub"
data-price="2750.00"
data-qty="3">
USB Hub
</button>

</div>

</div>

<button type="button" id="resetBtn">
Reset Form
</button>

</form>

</section>


<section class="card summary-card">

<h2>Live Invoice Summary</h2>

<div class="summary-row">
<span>Product Name:</span>
<span id="summaryName"></span>
</div>

<div class="summary-row">
<span>Unit Price:</span>
<span id="summaryPrice"></span>
</div>

<div class="summary-row">
<span>Quantity:</span>
<span id="summaryQuantity"></span>
</div>

<div class="summary-row">
<span>Subtotal:</span>
<span id="summarySubtotal"></span>
</div>

<div class="summary-row">
<span>GST (18%):</span>
<span id="summaryTax"></span>
</div>

<hr>

<div class="summary-row total">
<span>Grand Total:</span>
<span id="summaryTotal"></span>
</div>

<p id="statusText">
Dynamically Calculated (No Page Reload)
</p>

</section>

</main>

</div>

<script src="./Script_5.js"></script>

</body>
</html>
